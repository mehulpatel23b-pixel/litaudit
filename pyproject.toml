[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "litaudit"
version = "1.0.0"
description = "Zero-dependency security auditor for LiteLLM / LLM-gateway config files"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["litellm", "llm", "gateway", "security", "audit", "config", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
litaudit = "litaudit.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litaudit = ["py.typed"]
